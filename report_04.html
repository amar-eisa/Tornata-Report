async function unlock(raw){if(document.readyState==='loading')await new Promise(resolve=>document.addEventListener('DOMContentLoaded',resolve,{once:true}));const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(cfg.iv)},key,bytes(cfg.data));const html=dec.decode(plain);sessionStorage.setItem('tornata_key_v1',base64(raw));document.open();document.write(html);document.close()}

if(!crypto.subtle){button.disabled=true;status.textContent='يلزم متصفح حديث واتصال HTTPS لفتح التقارير.';return}const cached=sessionStorage.getItem('tornata_key_v1');if(cached)unlock(bytes(cached)).catch(()=>{sessionStorage.removeItem('tornata_key_v1');status.textContent='أدخل بيانات الدخول لفتح التقارير.'})})();</script></body></html>
