async function unlock(raw){const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(cfg.iv)},key,bytes(cfg.data));const html=dec.decode(plain);sessionStorage.setItem('tornata_key_v1',base64(raw));document.open();document.write(html);document.close()}
form.addEventListener('submit',async event=>{event.preventDefault();button.disabled=true;status.textContent='جارٍ فتح التقارير…';try{const u=document.getElementById('username').value.trim(),p=document.getElementById('password').value;const material=await crypto.subtle.importKey('raw',enc.encode(JSON.stringify([u,p])),'PBKDF2',false,['deriveBits']);const raw=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:bytes(cfg.salt),iterations:cfg.iterations},material,256);await unlock(raw)}catch(e){status.textContent='تعذر فتح التقرير. تحقق من اسم المستخدم وكلمة المرور.';button.disabled=false}});
if(!crypto.subtle){button.disabled=true;status.textContent='يلزم متصفح حديث واتصال HTTPS لفتح التقارير.';return}const cached=sessionStorage.getItem('tornata_key_v1');if(cached)unlock(bytes(cached)).catch(()=>{sessionStorage.removeItem('tornata_key_v1');status.textContent='أدخل بيانات الدخول لفتح التقارير.'})})();</script></body></html>
